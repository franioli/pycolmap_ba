# pycolmap_ba with ONNX Runtime (ALIKED, LightGlue, LoMa). This base file runs
# on any machine, on the CPU. Which extra files are loaded (GPU, GUI) is chosen
# once per machine with COMPOSE_FILE in .env, see .env.example and
# docs/docker.md.
#
#   docker compose build
#   docker compose run --rm ba                      # shell
#   docker compose run --rm ba python -m pytest     # tests

services:
  ba:
    image: pycolmap_ba
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Without a value, an arg is only passed when set in .env or the shell;
      # otherwise the default in docker/Dockerfile applies.
      args:
        - COLMAP_IMAGE
        - EXTRAS
        - WITH_CUDNN
        - BUILD_JOBS
        - UID
        - GID
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - type: bind
        source: ${DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      # A name is a Docker volume, a path a bind mount of that host folder.
      - ${COLMAP_CACHE:-colmap-models}:/home/app/.cache/colmap
      - cuda-cache:/home/app/.nv

volumes:
  colmap-models:
  cuda-cache:
