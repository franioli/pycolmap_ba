[project]
name = "pycolmap-ba"
version = "0.1.0"
description = "Custom bundle adjustment (GCPs, pose priors) on top of pycolmap."
# Upper-bounded because the local pycolmap wheel is cp312-only.
requires-python = ">=3.12,<3.13"

dependencies = [
    "enlighten>=1.12",
    "numpy>=2.0",
    "pandas>=3.0.5",
    "pyceres>=2.6",
    "pycolmap>=4.2.0.dev0",
]

[project.optional-dependencies]
# Reference-cloud constraints, pre-alignment and point-cloud export.
cloud = ["open3d>=0.19.0"]
# Everything the enrich/ examples and notebooks need on top of the core.
examples = [
    "imageio>=2.37.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "open3d>=0.19.0",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
# Installed in the Docker image too, so the tests run there.
test = ["pytest>=9.0"]
dev = ["ruff>=0.9", { include-group = "test" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# open3d pulls in dash, whose pytest plugin is irrelevant here and warns.
addopts = "-p no:dash"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycolmap_ba"]

# [tool.uv.sources]
# # Local ONNX-enabled build (docs/building_pycolmap_onnx.md). The Docker image
# # builds its own wheel and does not use this path.
# pycolmap = { path = "/home/francesco/software/wheels/pycolmap-4.2.0.dev0-cp312-cp312-linux_x86_64.whl" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D105/D107: magic methods and __init__ are documented by the class docstring.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pycolmap_ba"]

[tool.ruff.lint.per-file-ignores]
# Application layer: scripts document themselves in their module docstring.
"examples/*" = ["D103"]
