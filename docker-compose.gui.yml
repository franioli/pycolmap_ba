# COLMAP GUI over X11. Works on native Linux and on WSLg (software OpenGL).
# Enable it with COMPOSE_FILE in .env, see .env.example. On native Linux, allow
# the container user first: xhost +SI:localuser:$(id -un)

x-gui: &gui
  environment:
    # WSLg serves :0 even when DISPLAY is unset, e.g. in an SSH session.
    DISPLAY: ${DISPLAY:-:0}
    QT_QPA_PLATFORM: xcb
    # Docker's IPC isolation breaks X11 shared memory.
    QT_X11_NO_MITSHM: "1"
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix

services:
  ba: *gui
  ba-cpu: *gui
